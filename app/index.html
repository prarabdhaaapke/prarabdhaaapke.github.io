function palmQuality(d,w,h){ // d: RGBA Uint8ClampedArray
  const n=w*h,g=new Float32Array(n);let sum=0,skin=0;
  for(let i=0;i<n;i++){const r=d[i*4],gg=d[i*4+1],b=d[i*4+2];const y=0.299*r+0.587*gg+0.114*b;g[i]=y;sum+=y;

  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x,l=4*g[i]-g[i-1]-g[i+1]-g[i-w]-g[i+w];lv+=l*l;c++;}
  const sharp=Math.sqrt(lv/Math.max(c,1));
  // skin fraction inside central region, to confirm a hand fills the frame
  const q={bright:mean,sharp,skin:skin/n,issues:[],block:false};
  if(mean<70)q.issues.push('Too dark. Move to daylight or near a window.');
  if(mean>205)q.issues.push('Too bright or washed out. Avoid direct glare.');
